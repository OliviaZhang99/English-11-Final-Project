<!-- tells browser this is html5 -->
<!DOCTYPE html>

<!-- starts the whole page + language -->
<html lang="en">

<head>
    <!-- lets it read characters properly (like symbols and stuff) -->
    <meta charset="UTF-8">

    <!-- makes it look normal on phone not zoomed weird -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- what shows on the tab -->
    <title>Study Planner</title>

    <!-- connects css file so it actually looks nice -->
    <link rel="stylesheet" href="style.css">
</head>

<!-- everything u see on the web is inside body -->
<body>

    <!-- main box thing that holds everything -->
    <div class="container">

        <!-- big title on top -->
        <h1>Study Planner</h1>

        <!-- small text under title -->
        <p class="subtitle">Olivia</p>

        <!-- this whole part is like the input section -->
        <div class="form-box">

            <!-- where u type the task -->
            <input type="text" id="taskInput" placeholder="Enter a task">

            <!-- date picker(will improve so you can actually type in the date instead of only picking it from the calendar, will do that for final project display) -->
            <input type="date" id="dateInput">

            <!-- dropdown for priority -->
            <select id="priorityInput">
                <option value="Low">Low Priority</option>
                <option value="Medium">Medium Priority</option>
                <option value="High">High Priority</option>
            </select>

            <!-- dropdown for category (should add a other option so users can type in depending on their needs)-->
            <select id="categoryInput">
                <option value="School">School</option>
                <option value="Homework">Homework</option>
                <option value="Personal">Personal</option>
                <option value="Event">Event</option>
            </select>

            <!-- button to add task -->
            <button id="addBtn">Add Task</button>
        </div>

        <!-- top area for progress-->
        <div class="top-row">

            <!-- box that shows progress -->
            <div class="summary-box">

                <!-- title for that section -->
                <h2>Progress</h2>

                <!-- this gets changed by JS later but its just a set in the beginning -->
                <p id="progressText">0 of 0 tasks completed</p>
            </div>
        </div>

        <!-- section where tasks show up -->
        <div class="task-section">

            <!-- title -->
            <h2>Your Tasks</h2>

            <!-- empty list rn, JS fills it later-->
            <ul id="taskList"></ul>
        </div>
    </div>

    <!-- connects JS so buttons actually do something -->
    <script src="script.js"></script>

</body>
</html>
